services:
  db:
    image: mysql:8.0
    container_name: wiki_invertebrados_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: escola_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: wiki_invertebrados_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - db
    volumes:
      - .:/var/www/html

volumes:
  db_data: